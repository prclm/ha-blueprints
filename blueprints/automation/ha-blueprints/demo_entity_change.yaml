blueprint:
  name: Demo - Entity state notification
  description: Create a persistent notification when an entity changes state.
  domain: automation
  source_url: https://github.com/prclm/ha-blueprints/blob/main/blueprints/automation/ha-blueprints/demo_entity_change.yaml
  input:
    entity:
      name: Entity
      description: The entity to monitor.
      selector:
        entity: {}
    notification_title:
      name: Notification title
      description: The title shown on the persistent notification.
      default: Entity state changed
      selector:
        text: {}

trigger:
  - platform: state
    entity_id: !input entity

condition: []

action:
  - service: persistent_notification.create
    data:
      title: !input notification_title
      message: >-
        {{ trigger.to_state.name }} changed from
        {{ trigger.from_state.state if trigger.from_state else 'unknown' }}
        to {{ trigger.to_state.state }}.

mode: queued
